name: U-Line CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: PHP ${{ matrix.php }} Unit Testing & Syntax Lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2']

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_mysql, pdo_sqlite, curl, mbstring, openssl
          tools: composer
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Copy Environment Configuration
        run: cp .env.example .env

      - name: Cache Composer Dependencies
        id: composer-cache
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: PHP Syntax Check (Linting)
        run: |
          echo "Running syntax check on core application files..."
          find app/ -name "*.php" -exec php -l {} \;

      - name: Run PHPUnit Test Suite
        run: vendor/bin/phpunit --testdox
